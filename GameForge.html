<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#0a0b0a">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameForge</title>
<style>
@font-face{font-family:"GFArabic";src:local("Noto Kufi Arabic"),local("Noto Sans Arabic"),local("Geeza Pro"),local("Dubai"),local("Segoe UI"),local("Tahoma"),local("DejaVu Sans"),local("Arial");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
:root{
  color-scheme:dark;
  --coal:#0a0b0a;--coal2:#0e100e;--panel:#111411;--panel2:#161a16;--line:#1c261e;--line2:#263328;
  --g:#3fbf6a;--g2:#34a65b;--gd:#226b3c;--gm:#4a6b53;--gdim:#122217;
  --glow:0 0 4px rgba(63,191,106,.18);--tglow:none;
  --ink:var(--g2);--muted:var(--gm);--violet:var(--g);
  --grad:#173322;
  --shadow:0 18px 40px -16px rgba(0,0,0,.8),0 0 0 1px var(--line);
  --font:"GFArabic",ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Arabic","Noto Kufi Arabic","Geeza Pro",Tahoma,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--g2);background:var(--coal);-webkit-font-smoothing:antialiased}
::selection{background:var(--gd);color:#d8f5e1}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;caret-color:var(--g)}
::placeholder{color:var(--gm);opacity:.8}
*{scrollbar-color:var(--line2) transparent;scrollbar-width:thin}
.i{width:18px;height:18px;flex:none}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
.top{height:58px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:#0f110f;color:var(--g);position:relative;z-index:30;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(77,255,136,.06)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:34px;height:34px;filter:none}
.brand b{font-size:16px;letter-spacing:.5px;display:block;line-height:1.15;text-shadow:var(--glow)}
.brand small{font-size:11px;color:var(--gm);display:block}
.proj{background:var(--coal2);border:1px solid var(--line);color:var(--g);border-radius:8px;padding:7px 12px;width:min(240px,22vw);font-weight:600;outline:none;transition:.15s;text-shadow:var(--tglow)}
.proj:hover{border-color:var(--line2)}
.proj:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(77,255,136,.15)}
.tabs{display:flex;background:var(--coal2);border:1px solid var(--line);padding:3px;border-radius:10px;gap:2px;flex:none}
.tabs button{border:0;background:none;color:var(--gm);padding:6px 14px;border-radius:7px;display:flex;align-items:center;gap:7px;font-weight:650;font-size:13px;transition:.15s}
.tabs button:hover{color:var(--g)}
.tabs button.on{background:var(--gdim);color:var(--g);box-shadow:inset 0 0 0 1px var(--gd)}
.tabs .i{width:16px;height:16px}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:4px;position:relative}
.save{font-size:12px;color:var(--gm);display:flex;align-items:center;gap:7px;padding-inline-end:10px;white-space:nowrap}
.save i{width:7px;height:7px;border-radius:50%;background:var(--g);}
.save.busy i{background:#b8913a}
.save.err i{background:#c0504a;}
.ic{width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--g2);display:grid;place-items:center;transition:.15s}
.ic:hover{background:var(--gdim);color:var(--g)}
.ic:disabled{opacity:.3;cursor:default;background:none}
.lang{height:34px;min-width:46px;border-radius:8px;border:1px solid var(--gd);background:transparent;color:var(--g);font-weight:800;padding:0 10px;margin-inline:4px;transition:.15s;text-shadow:var(--tglow)}
.lang:hover{background:var(--gdim)}
.menu{position:absolute;inset-inline-end:0;top:46px;background:var(--panel);color:var(--g2);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:240px;z-index:40}
.menu button{display:flex;width:100%;border:0;background:none;padding:9px 12px;border-radius:7px;text-align:start;gap:10px;align-items:center;font-size:13px}
.menu button:hover{background:var(--gdim);color:var(--g)}
.menu button.danger{color:#c0504a}
.menu button.danger:hover{background:#3a1a18}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 6px}

main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0}
/* CRT scanlines + vignette */
main::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:25;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0,rgba(0,0,0,.10) 1px,transparent 1px,transparent 3px),radial-gradient(ellipse at center,transparent 65%,rgba(0,0,0,.35) 100%)}

/* ---------- whiteboard ---------- */
.viewport{position:absolute;inset:0;overflow:hidden;background-color:var(--coal);background-image:radial-gradient(circle,rgba(63,191,106,.09) 1px,transparent 1.4px);background-size:24px 24px;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
.viewport[data-tool="pan"],.viewport.space{cursor:grab}
.viewport.panning{cursor:grabbing!important}
.viewport[data-tool="pen"]{cursor:crosshair}
.viewport[data-tool="sticky"],.viewport[data-tool="shape"],.viewport[data-tool="text"],.viewport[data-tool="table"],.viewport[data-tool="list"],.viewport[data-tool="stamp"]{cursor:copy}
.viewport.dropping{box-shadow:inset 0 0 0 2px var(--g);background-color:#18201a}
.board{position:absolute;left:0;top:0;transform-origin:0 0;direction:ltr;will-change:transform}
.board.anim{transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.viewport.anim{transition:background-position .42s cubic-bezier(.2,.8,.2,1),background-size .42s cubic-bezier(.2,.8,.2,1)}
.live-ink{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.marquee{position:absolute;border:1.5px solid var(--g);background:rgba(77,255,136,.07);border-radius:3px;pointer-events:none;z-index:5;box-shadow:var(--glow)}
.marquee.ghost{border-style:dashed}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--gm);text-align:center;font-size:14px;line-height:1.8}
.empty-hint b{display:block;font-size:20px;color:var(--g);margin-bottom:4px;text-shadow:var(--glow)}
.empty-hint b::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.node{position:absolute;user-select:none;-webkit-user-select:none}
.node.sel{outline:2px solid var(--g);outline-offset:4px;border-radius:6px;filter:none}
.node .rh{display:none;position:absolute;right:-11px;bottom:-11px;width:14px;height:14px;background:var(--coal);border:2.5px solid var(--g);border-radius:50%;cursor:nwse-resize;z-index:3;box-shadow:var(--glow)}
.node.sel.single .rh{display:block}
.node.editing .rh{display:none}
[data-edit]{outline:none;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start}
[data-edit][contenteditable="true"],[data-edit][contenteditable="plaintext-only"]{user-select:text;-webkit-user-select:text;cursor:text;background:rgba(77,255,136,.07);box-shadow:0 0 0 1.5px rgba(77,255,136,.55);border-radius:3px}
[data-edit]:empty::before{content:attr(data-ph);opacity:.45;pointer-events:none}

.n-sticky::before{content:"";position:absolute;top:-7px;left:50%;width:64px;height:14px;transform:translateX(-50%);background:var(--solid);opacity:.55;border-radius:2px;z-index:1;pointer-events:none;}
.n-sticky .body{width:100%;height:100%;background:var(--soft);border:1px solid color-mix(in srgb,var(--solid) 45%,transparent);border-radius:6px;box-shadow:0 14px 26px -16px rgba(0,0,0,.9),inset 0 0 24px rgba(0,0,0,.35);padding:22px 18px 16px;overflow:hidden;font-size:15.5px;line-height:1.6;color:var(--g);text-shadow:var(--tglow)}
.n-sticky .txt{min-height:100%}
.n-text .txt{color:var(--g);line-height:1.3;padding:2px 2px;min-height:1.3em;text-shadow:var(--glow)}
.n-text[data-muted] .txt{color:var(--gm)}
.n-shape .shp,.n-shape .shp-box,.n-shape .shp-frame{position:absolute;inset:0}
.n-shape .shp{overflow:visible}
.shp-box{background:var(--soft);border:2px solid var(--solid);border-radius:12px;box-shadow:0 0 10px -2px color-mix(in srgb,var(--solid) 55%,transparent)}
.shp-box.ellipse{border-radius:50%}
.shp-frame{border-radius:16px}
.shp-frame::before{content:"";position:absolute;inset:0;border-radius:16px;background:var(--soft);opacity:.5}
.shp-frame::after{content:"";position:absolute;inset:0;border-radius:16px;border:1.5px dashed var(--solid);opacity:.5}
.shape-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px 18px;pointer-events:none}
.shape-lbl .txt{pointer-events:auto;text-align:center;font-weight:700;font-size:15px;color:var(--g);line-height:1.4;min-width:12px;max-width:100%;text-shadow:var(--tglow)}
.k-triangle .shape-lbl{padding-top:38%}
.k-arrowR .shape-lbl,.k-arrowL .shape-lbl{padding:6px 22%;}
.k-arrowR .shape-lbl .txt,.k-arrowL .shape-lbl .txt{font-size:12px}
.k-frame .shape-lbl{align-items:flex-start;justify-content:flex-start;padding:16px 22px}
.k-frame .shape-lbl .txt{font-size:20px;font-weight:800;color:var(--g);text-align:start;letter-spacing:.5px;text-shadow:var(--glow)}
.n-pen svg{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--solid) 70%,transparent))}
.n-image img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;pointer-events:none;box-shadow:0 16px 30px -18px rgba(0,0,0,.9),0 0 0 1px var(--line2);background:#0c0e0c;filter:brightness(.7) saturate(.85)}
.n-table .nc,.n-list .nc{background:var(--panel);border-radius:10px;box-shadow:0 16px 32px -20px rgba(0,0,0,.9),0 0 0 1px var(--line2);overflow:hidden;color:var(--g2)}
.tbl-h,.lst-h{padding:13px 16px 11px;font-weight:800;font-size:15px;border-top:3px solid var(--solid);display:flex;align-items:center;gap:10px;color:var(--g);text-shadow:var(--glow)}
.lst-h [data-edit]{flex:1}
.n-table table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.n-table th,.n-table td{border-top:1px solid var(--line);padding:9px 12px;vertical-align:top;line-height:1.45;text-align:start}
.n-table th{background:var(--soft);font-weight:750;font-size:12px;color:var(--g);text-transform:uppercase;letter-spacing:.5px}
.n-table td+td,.n-table th+th{border-inline-start:1px solid var(--line)}
.n-table tr:nth-child(odd) td{background:rgba(77,255,136,.025)}
.lst-c{font-size:12px;font-weight:700;color:var(--g);background:var(--gdim);border-radius:4px;padding:1px 7px;text-shadow:none}
.lst-bar{height:4px;background:var(--gdim);margin:0 16px 6px;border-radius:2px;overflow:hidden}
.lst-bar i{display:block;height:100%;background:var(--g);box-shadow:var(--glow);transition:width .3s}
.lst-items{padding:2px 10px 12px}
.li{display:flex;gap:10px;align-items:flex-start;padding:6px 6px;border-radius:6px;font-size:13.5px;line-height:1.45}
.li:hover{background:rgba(77,255,136,.05)}
.chk{flex:none;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--gd);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px;color:var(--coal);transition:.15s}
.chk .i{width:13px;height:13px;stroke-width:3}
.li.done .chk{background:var(--g);border-color:var(--g);box-shadow:var(--glow)}
.li .lt{flex:1;min-width:20px}
.li.done .lt{text-decoration:line-through;color:var(--gm)}
.stamp{width:100%;height:100%;display:grid;place-items:center;line-height:1;filter:brightness(.75) saturate(.8)}

/* ---------- floating UI ---------- */
.toolbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;background:rgba(22,25,22,.96);backdrop-filter:blur(12px);border-radius:14px;box-shadow:var(--shadow);z-index:12}
.tb{position:relative;width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--g2);display:grid;place-items:center;transition:background .15s,color .15s,transform .15s}
.tb .i{width:21px;height:21px}
.tb:hover{background:var(--gdim);color:var(--g)}
.tb:active{transform:scale(.94)}
.tb.on{background:var(--gdim);color:var(--g);box-shadow:inset 0 0 0 1px var(--gd)}
.tb .k{position:absolute;bottom:3px;inset-inline-end:5px;font-size:8.5px;font-weight:800;opacity:.5}
.tb.on .k{opacity:.8}
.tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(4px);background:#0c0e0c;color:var(--g);border:1px solid var(--gd);font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;display:flex;gap:8px;align-items:center;text-shadow:var(--tglow)}
.tb:hover .tip,.zb:hover .tip{opacity:1;transform:translateX(-50%)}
kbd{font-family:inherit;font-size:11px;background:var(--gdim);color:var(--g);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;direction:ltr;unicode-bidi:isolate}
.tb-sep{width:1px;height:26px;background:var(--line2);margin:0 5px}
.toolopts{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);z-index:12;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(6px)}}
.ctxbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:5px 7px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);z-index:12;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.cb{height:32px;min-width:32px;border:0;background:none;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;font-size:12px;font-weight:650;color:var(--g2);white-space:nowrap;flex:none}
.cb:hover{background:var(--gdim);color:var(--g)}
.cb.on{background:var(--gdim);color:var(--g);box-shadow:inset 0 0 0 1px var(--gd)}
.cb.danger:hover{background:#3a1a18;color:#c0504a}
.cb .i{width:17px;height:17px}
.sep{width:1px;height:22px;background:var(--line2);margin:0 4px;flex:none}
.ctx-lbl{font-size:12px;font-weight:700;color:var(--gm);padding:0 6px;white-space:nowrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);background:var(--sw);box-shadow:0 0 0 1px var(--line2);padding:0;flex:none;transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--g),0 0 10px var(--sw)}
.em{width:32px;height:32px;border:0;background:none;border-radius:7px;font-size:19px;padding:0;flex:none;line-height:1}
.em:hover{background:var(--gdim)}
.em.on{background:var(--gdim);box-shadow:inset 0 0 0 1px var(--g)}
.pw{width:30px;height:30px;border:0;background:none;border-radius:7px;display:grid;place-items:center;padding:0;flex:none}
.pw:hover{background:var(--gdim)}
.pw.on{background:var(--gdim);box-shadow:inset 0 0 0 1px var(--g)}
.pw i{display:block;border-radius:50%;background:var(--g)}
.zoom{position:absolute;bottom:24px;inset-inline-end:18px;display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border-radius:10px;box-shadow:var(--shadow);z-index:11}
.zb{position:relative;height:32px;min-width:32px;border:0;background:none;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--g2);padding:0 6px}
.zb:hover{background:var(--gdim);color:var(--g)}
.zb .tip{bottom:calc(100% + 10px)}
#zoomLbl{min-width:52px;direction:ltr}
.hint{position:absolute;top:16px;inset-inline-start:16px;font-size:12px;color:var(--gm);background:rgba(20,22,20,.8);backdrop-filter:blur(6px);border-radius:6px;padding:6px 10px;z-index:11;pointer-events:none;box-shadow:0 0 0 1px var(--line)}
.hint::before{content:"> ";color:var(--g)}

/* ---------- kanban ---------- */
#kanbanView{display:flex;flex-direction:column;background:radial-gradient(1200px 400px at 80% -10%,rgba(77,255,136,.06) 0,transparent 60%),var(--coal)}
.kb-head{display:flex;align-items:center;gap:18px;padding:20px 26px 12px;flex-wrap:wrap}
.kb-title h2{margin:0;font-size:20px;letter-spacing:.5px;color:var(--g);text-shadow:var(--glow)}
.kb-title p{margin:3px 0 0;color:var(--gm);font-size:12.5px}
.kb-prog{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:8px;padding:8px 14px;box-shadow:0 0 0 1px var(--line);font-size:12px;font-weight:650;color:var(--g2)}
.kb-prog .bar{width:120px;height:7px;background:var(--gdim);border-radius:2px;overflow:hidden}
.kb-prog .bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--g) 0 6px,transparent 6px 8px);box-shadow:var(--glow);transition:width .35s}
.kb-tools{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:8px;padding:0 11px;box-shadow:0 0 0 1px var(--line);height:38px;color:var(--gm)}
.search input{border:0;outline:none;background:none;width:190px;font-size:13px;color:var(--g)}
.search:focus-within{box-shadow:0 0 0 1.5px var(--g)}
.sel-in{height:38px;border-radius:8px;border:0;box-shadow:0 0 0 1px var(--line);background:var(--panel);color:var(--g2);padding:0 10px;font-size:13px;outline:none}
.btn-primary{background:var(--gdim);color:var(--g);border:1px solid var(--gd);border-radius:8px;padding:0 16px;height:38px;font-weight:800;display:inline-flex;align-items:center;gap:7px;font-size:13px}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--gdim);color:var(--g2);border:0;border-radius:8px;padding:0 16px;height:38px;font-weight:650;font-size:13px}
.btn-danger{background:none;border:0;color:#c0504a;font-weight:650;font-size:13px;padding:0 6px;height:38px;border-radius:8px}
.btn-danger:hover{background:#3a1a18}
.kb-cols{flex:1;display:flex;gap:14px;padding:8px 26px 26px;overflow-x:auto;align-items:flex-start;min-height:0}
.col{flex:1 0 250px;max-width:340px;background:var(--coal2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:100%;transition:border-color .15s,background .15s}
.col.over{border-color:var(--g);background:#18221b;box-shadow:0 0 16px -6px rgba(77,255,136,.5)}
.col header{display:flex;align-items:center;gap:8px;padding:13px 14px 9px;border-bottom:1px dashed var(--line);margin-bottom:6px}
.col .dot{width:9px;height:9px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
.col header b{font-size:13px;color:var(--g);letter-spacing:.4px}
.cnt{background:var(--gdim);border-radius:4px;padding:1px 7px;font-size:11px;color:var(--g2);font-weight:700}
.col-add{margin-inline-start:auto;width:28px;height:28px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--gm)}
.col-add:hover{background:var(--gdim);color:var(--g)}
.col-body{padding:4px 10px 6px;overflow-y:auto;min-height:56px;display:flex;flex-direction:column;gap:9px;flex:1}
.col-empty{font-size:12px;color:var(--gm);text-align:center;padding:16px 0;border:1px dashed var(--line2);border-radius:8px}
.card{background:var(--panel);border-radius:9px;padding:11px 13px 10px;box-shadow:0 8px 18px -12px rgba(0,0,0,.9);border:1px solid var(--line);border-inline-start:3px solid var(--pc);cursor:grab;position:relative;transition:box-shadow .15s,transform .15s,border-color .15s;outline:none;color:var(--g2)}
.card:hover{border-color:var(--line2);border-inline-start-color:var(--pc);box-shadow:0 14px 26px -14px rgba(0,0,0,.9),0 0 12px -6px rgba(77,255,136,.4);transform:translateY(-1px)}
.card:focus-visible{box-shadow:0 0 0 1.5px var(--g)}
.card.dragging{opacity:.35}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--g),0 0 18px rgba(77,255,136,.6)}}
.card.is-done h4{text-decoration:line-through;color:var(--gm);text-shadow:none}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:4px;background:var(--tb);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.prio .i{width:13px;height:13px}
.card h4{margin:8px 0 3px;font-size:14px;line-height:1.45;font-weight:700;color:var(--g);text-shadow:var(--tglow)}
.card p{margin:0;font-size:12px;color:var(--gm);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--gm);min-height:24px}
.due{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.due .i{width:13px;height:13px}
.due.over{color:#c0504a}
.mv{display:flex;gap:3px;margin-inline-start:auto;opacity:0;transition:opacity .15s}
.card:hover .mv,.card:focus-within .mv,.card:focus .mv{opacity:1}
.mv button{width:24px;height:24px;border-radius:5px;border:1px solid var(--line2);background:var(--coal2);display:grid;place-items:center;padding:0;color:var(--g2)}
.mv button:hover:not(:disabled){border-color:var(--g);color:var(--g)}
.mv button:disabled{opacity:.3;cursor:default}
.mv .i{width:14px;height:14px}
[dir="rtl"] .flip{transform:scaleX(-1)}
.avatar{width:25px;height:25px;border-radius:50%;background:var(--gdim);border:1px solid var(--gd);color:var(--g);font-size:10.5px;font-weight:800;display:grid;place-items:center;flex:none}
.card-foot .avatar:only-child,.card-foot .due+.avatar{margin-inline-start:auto}
.drop-line{height:2px;border-radius:2px;background:var(--g);margin:-2px 2px;flex:none;}
.quick{padding:4px 10px 12px;margin:0}
.quick input{width:100%;border:1px dashed var(--line2);border-radius:8px;padding:9px 11px;background:transparent;font-size:12.5px;outline:none;transition:.15s;color:var(--g)}
.quick input:focus{border-style:solid;border-color:var(--g);background:var(--panel)}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(5,8,5,.7);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--panel);color:var(--g2);border:1px solid var(--line2);border-radius:12px;width:min(580px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.9),0 0 0 transparent;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.4}}
.dlg header{display:flex;align-items:center;padding:18px 22px 6px}
.dlg h3{margin:0;font-size:17px;color:var(--g);text-shadow:var(--glow)}
.dlg h3::before{content:"> ";opacity:.7}
.x{margin-inline-start:auto;width:34px;height:34px;border-radius:7px;border:0;background:none;font-size:22px;color:var(--gm)}
.x:hover{background:var(--gdim);color:var(--g)}
.dlg form{padding:8px 22px 20px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;font-size:12px;font-weight:700;color:var(--gm);text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld textarea,.fld select{border:1px solid var(--line2);border-radius:7px;padding:9px 12px;font-size:14px;font-weight:500;outline:none;background:var(--coal);resize:vertical;color:var(--g);text-transform:none;letter-spacing:0}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(77,255,136,.15)}
.fld.err input{border-color:#c0504a;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.dlg footer{display:flex;align-items:center;gap:8px;margin-top:8px}
.dlg footer .sp{flex:1}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;padding:10px 22px 22px}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.keys kbd{padding:3px 8px;font-weight:700;white-space:nowrap}
.keys-note{padding:0 22px 20px;margin:0;color:var(--gm);font-size:12px}
.toasts{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:120;pointer-events:none}
.toast{background:#0c0e0c;color:var(--g);border:1px solid var(--gd);font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:8px;box-shadow:0 12px 30px -10px rgba(0,0,0,.8),0 0 0 transparent;display:flex;align-items:center;gap:12px;pointer-events:auto;animation:rise .2s ease-out;transition:opacity .3s,transform .3s;text-shadow:var(--tglow)}
.toast.out{opacity:0;transform:translateY(6px)}
.toast button{background:var(--gdim);border:1px solid var(--gd);color:var(--g);border-radius:5px;padding:4px 10px;font-weight:800;font-size:12px}
@media (max-width:820px){.brand div,.save span{display:none}.proj{width:120px}.hint{display:none}.tb{width:38px;height:40px}.tb .k{display:none}}

}

function contentBBox(nodes=state.nodes){
  if(!nodes.length)return null;let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for(const n of nodes){a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+n.w);d=Math.max(d,n.y+(n.h||40))}

}

  const r=viewport.getBoundingClientRect();if(!r.width||!r.height)return;
  measureAll();
  const bb=contentBBox();
  if(!bb){state.view={x:r.width/2,y:r.height/2,z:1};if(anim)animateView();applyView();return}
  const padX=60,padTop=74,padBot=110,aw=Math.max(100,r.width-padX*2),ah=Math.max(100,r.height-padTop-padBot);
  const z=clamp(Math.min(aw/bb.w,ah/bb.h),.12,1);
  state.view={z,x:Math.round(r.width/2-(bb.x+bb.w/2)*z),y:Math.round(padTop+ah/2-(bb.y+bb.h/2)*z)};

/* ================= node rendering ================= */
function penD(n){
  const sx=n.w/(n.vbw||n.w),sy=n.h/(n.vbh||n.h),p=n.points.map(([x,y])=>[x*sx,y*sy]);
  return pathFrom(p);
}
function pathFrom(p){
  if(!p.length)return'';if(p.length===1)return`M${p[0][0]} ${p[0][1]}l0.01 0`;
  let d=`M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;d+=` Q${p[i][0].toFixed(1)} ${p[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`}
  const l=p[p.length-1];return d+` L${l[0].toFixed(1)} ${l[1].toFixed(1)}`;
}
function shapeHTML(n){
  if(n.kind==='rect'||n.kind==='ellipse')return`<div class="shp-box ${n.kind}"></div>`;
  if(n.kind==='frame')return`<div class="shp-frame"></div>`;
  const P=POLY[n.kind]||POLY.diamond,w=n.w-4,h=n.h-4;
  const pts=P.map(([px,py])=>`${(px/100*w+2).toFixed(1)},${(py/100*h+2).toFixed(1)}`).join(' ');
  return`<svg class="shp" width="${n.w}" height="${n.h}"><polygon points="${pts}" style="fill:var(--soft);stroke:var(--solid);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--solid) 60%,transparent))" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

    case'pen':return`<svg width="${n.w}" height="${n.h}"><path d="${penD(n)}" fill="none" style="stroke:var(--solid)" stroke-width="${n.width||4}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function pasteNodes(json){

const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
async function prepImage(file){
  const url=await readURL(file);const img=await loadImg(url);
  let w=img.naturalWidth||400,h=img.naturalHeight||300;const MAX=1600;
  if(file.type==='image/svg+xml'||file.type==='image/gif'||(file.size<400000&&w<=MAX&&h<=MAX))return{src:url,w,h};
  const s=Math.min(1,MAX/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let out=c.toDataURL('image/webp',.86);if(!out.startsWith('data:image/webp'))out=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.86);
  return{src:out,w:c.width,h:c.height};
}
async function addImageFile(file,cx,cy){
  try{
    const{src,w,h}=await prepImage(file);const s=Math.min(1,440/Math.max(w,h));
    const nw=Math.max(40,Math.round(w*s)),nh=Math.max(30,Math.round(h*s));
    const n=addNode({id:uid(),type:'image',x:Math.round(cx-nw/2),y:Math.round(cy-nh/2),w:nw,h:nh,src});
    setSel([n.id]);commit();toast(t('imageAdded'));
  }catch(e){toast(t('imgFail'))}
}

viewport.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();viewport.classList.add('dropping')}});
viewport.addEventListener('dragleave',e=>{if(e.target===viewport)viewport.classList.remove('dropping')});
viewport.addEventListener('drop',e=>{viewport.classList.remove('dropping');const fs=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;e.preventDefault();const p=toWorld(e.clientX,e.clientY);fs.forEach((f,i)=>addImageFile(f,p.x+i*36,p.y+i*36))});

function onDown(e){
  const tg=e.target;
  if(ui.editing&&ui.editing.el.contains(tg))return;
  if(ui.editing)endEdit();
  closeMenu();
  const ae=document.activeElement;if(ae&&ae!==document.body&&ae!==viewport&&!ae.closest?.('.node'))ae.blur();
  if(e.button===1||(e.button===0&&(ui.tool==='pan'||ui.spaceDown))){
    e.preventDefault();ui.drag={type:'pan',sx:e.clientX,sy:e.clientY,x0:state.view.x,y0:state.view.y};viewport.classList.add('panning');return;
  }
  if(e.button!==0)return;
  e.preventDefault();
  const w=toWorld(e.clientX,e.clientY),tool=ui.tool;
  if(tool==='pen'){ui.drag={type:'ink',pts:[[w.x,w.y]]};drawLive();return}
  if(tool==='shape'){ui.drag={type:'shape',sx:e.clientX,sy:e.clientY,wx:w.x,wy:w.y,moved:false};return}
  if(tool==='image'){pickImage(w);setTool('select');return}
  if(['sticky','text','table','list','stamp'].includes(tool)){placeAt(tool,w.x,w.y);return}
  const ne=tg.closest('.node');
  if(ne&&tg.classList.contains('rh')){const n=getNode(ne.dataset.id);ui.drag={type:'resize',n,sx:e.clientX,sy:e.clientY,w0:n.w,h0:n.h,moved:false};return}
  if(ne){
    const id=ne.dataset.id;

    if(chk&&!e.shiftKey){if(!ui.sel.has(id)||ui.sel.size>1)setSel([id]);toggleCheck(id,+chk.dataset.chk);return}
    let clickOnly=null;
    if(e.shiftKey){ui.sel.has(id)?ui.sel.delete(id):ui.sel.add(id);refreshSel()}
    else if(!ui.sel.has(id))setSel([id]);
    else if(ui.sel.size>1)clickOnly=id;
    if(!ui.sel.has(id))return;
    ui.drag={type:'move',sx:e.clientX,sy:e.clientY,moved:false,clickOnly,items:selNodes().map(n=>({n,x:n.x,y:n.y}))};

function onMove(e){
  const d=ui.drag;if(!d)return;const z=state.view.z;
  const dxs=e.clientX-d.sx,dys=e.clientY-d.sy;
  switch(d.type){
    case'pan':state.view.x=d.x0+dxs;state.view.y=d.y0+dys;applyView(false);break;
    case'move':{
      if(!d.moved&&Math.hypot(dxs,dys)<3)return;d.moved=true;
      for(const o of d.items){o.n.x=Math.round(o.x+dxs/z);o.n.y=Math.round(o.y+dys/z);positionNode(nodeEls.get(o.n.id),o.n)}
      break}
    case'resize':{
      d.moved=true;const n=d.n,dx=dxs/z,dy=dys/z;
      let w=Math.max(MINW[n.type]||40,d.w0+dx),h=d.h0+dy;
      if(n.type==='image'&&!e.shiftKey)h=w*(d.h0/d.w0);
      else if(n.type==='stamp'){w=h=Math.max(24,d.w0+Math.max(dx,dy))}
      else if(n.type==='pen'&&e.shiftKey)h=w*(d.h0/d.w0);
      n.w=Math.round(w);if(!AUTOH.has(n.type))n.h=Math.round(Math.max(n.type==='pen'?8:30,h));
      if(['pen','shape','stamp'].includes(n.type))renderNode(n);else{positionNode(nodeEls.get(n.id),n);measure(n)}
      break}
    case'marquee':case'shape':{
      if(!d.moved&&Math.hypot(dxs,dys)<4)return;d.moved=true;
      const r=viewport.getBoundingClientRect();
      const x1=Math.min(d.sx,e.clientX),y1=Math.min(d.sy,e.clientY),x2=Math.max(d.sx,e.clientX),y2=Math.max(d.sy,e.clientY);
      marquee.hidden=false;marquee.classList.toggle('ghost',d.type==='shape');
      Object.assign(marquee.style,{left:x1-r.left+'px',top:y1-r.top+'px',width:x2-x1+'px',height:y2-y1+'px'});
      if(d.type==='marquee'){
        const a=toWorld(x1,y1),b=toWorld(x2,y2);const s=new Set(d.base);
        for(const n of state.nodes){

          const hit=n.kind==='frame'?(n.x>=a.x&&n.y>=a.y&&n.x+n.w<=b.x&&n.y+nh<=b.y):(n.x<b.x&&n.x+n.w>a.x&&n.y<b.y&&n.y+nh>a.y);

}
function onUp(e){

        const w=toWorld(e.clientX,e.clientY);const x=Math.min(d.wx,w.x),y=Math.min(d.wy,w.y);

<div class="card-top"><span class="tag" style="--tb:${tg[0]};--tc:${tg[1]}">${esc(t('tag_'+x.tag))}</span><span class="prio" style="color:${PCOLOR[x.prio]}">${svg('flag')}${esc(t('p_'+x.prio))}</span></div>
<h4>${esc(x.title)}</h4>${x.desc?`<p>${esc(x.desc)}</p>`:''}
<div class="card-foot">${x.due?`<span class="due${over?' over':''}">${svg('cal')}${esc(fmtDate(x.due))}</span>`:''}<span class="mv"><button data-mv="-1" ${idx<=0?'disabled':''} title="${esc(t('movePrev'))}" aria-label="${esc(t('movePrev'))}">${svg('chevL','flip')}</button><button data-mv="1" ${idx>=STATUSES.length-1?'disabled':''} title="${esc(t('moveNext'))}" aria-label="${esc(t('moveNext'))}">${svg('chev','flip')}</button></span>${x.assignee?`<span class="avatar" title="${esc(x.assignee)}">${esc(initials(x.assignee))}</span>`:''}</div></article>`;
}
function renderKanban(){
  const q=$('#kbSearch').value.trim().toLowerCase(),tf=$('#kbTag').value;
  const match=x=>(!tf||x.tag===tf)&&(!q||(x.title+' '+x.desc+' '+x.assignee).toLowerCase().includes(q));
  kbCols.innerHTML=STATUSES.map(s=>{
    const list=state.tasks.filter(x=>x.status===s&&match(x));
    return`<section class="col" data-status="${s}" style="--c:${SCOLOR[s]}"><header><i class="dot"></i><b>${esc(t('st_'+s))}</b><span class="cnt">${list.length}</span><button class="col-add" data-add="${s}" title="${esc(t('newTask'))}" aria-label="${esc(t('newTask'))}">${svg('plus')}</button></header><div class="col-body">${list.map(cardHTML).join('')||`<div class="col-empty">${esc(t('empty'))}</div>`}</div><form class="quick" data-quick="${s}"><input placeholder="${esc(t('quickAdd'))}" maxlength="140" aria-label="${esc(t('quickAdd'))}"></form></section>`;
  }).join('');
  const total=state.tasks.length,done=state.tasks.filter(x=>x.status==='done').length;
  $('#kbProgTxt').textContent=t('progress',{d:done,t:total});$('#kbProgBar').style.width=(total?Math.round(done/total*100):0)+'%';
}
function moveTaskTo(id,status,beforeId){
  const i=state.tasks.findIndex(x=>x.id===id);if(i<0)return;
  const[tk]=state.tasks.splice(i,1);tk.status=status;
  let j=beforeId?state.tasks.findIndex(x=>x.id===beforeId):-1;
  if(j<0){let last=-1;state.tasks.forEach((x,k)=>{if(x.status===status)last=k});j=last<0?state.tasks.length:last+1}
  state.tasks.splice(j,0,tk);commit();renderKanban();
}
function flashCard(id){requestAnimationFrame(()=>{const c=kbCols.querySelector(`[data-tid="${id}"]`);if(c){c.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});c.classList.add('flash');c.focus({preventScroll:true})}})}
kbCols.addEventListener('click',e=>{
  const mv=e.target.closest('[data-mv]');
  if(mv){const id=mv.closest('.card').dataset.tid,tk=getTask(id);const ni=STATUSES.indexOf(tk.status)+(+mv.dataset.mv);if(ni>=0&&ni<STATUSES.length){moveTaskTo(id,STATUSES[ni]);flashCard(id)}return}
  const add=e.target.closest('[data-add]');if(add){openTask(null,add.dataset.add);return}
  const c=e.target.closest('.card');if(c)openTask(c.dataset.tid);
});
kbCols.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.closest('[data-quick]');if(!f)return;const inp=f.querySelector('input'),v=inp.value.trim();if(!v)return;
  const s=f.dataset.quick;const tk={id:uid(),title:v,desc:'',status:s,prio:'normal',tag:$('#kbTag').value||'design',assignee:'',due:'',created:Date.now()};
  state.tasks.push(tk);commit();renderKanban();$(`[data-quick="${s}"] input`,kbCols).focus();flashCard(tk.id);$(`[data-quick="${s}"] input`,kbCols).focus();
});
let dropLine=null;
const clearDrop=()=>{dropLine?.remove();dropLine=null;$$('.col.over',kbCols).forEach(c=>c.classList.remove('over'))};
kbCols.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card');if(!c)return;ui.dragTask=c.dataset.tid;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.tid)}catch(_){}requestAnimationFrame(()=>c.classList.add('dragging'))});
kbCols.addEventListener('dragend',()=>{$$('.card.dragging',kbCols).forEach(c=>c.classList.remove('dragging'));clearDrop();ui.dragTask=null});
kbCols.addEventListener('dragover',e=>{
  const col=e.target.closest('.col');if(!col||!ui.dragTask)return;e.preventDefault();e.dataTransfer.dropEffect='move';
  $$('.col.over',kbCols).forEach(c=>c!==col&&c.classList.remove('over'));col.classList.add('over');
  const body=col.querySelector('.col-body');const cards=$$('.card:not(.dragging)',body);
  const before=cards.find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  if(!dropLine){dropLine=document.createElement('div');dropLine.className='drop-line'}
  if(before){if(dropLine.nextElementSibling!==before)body.insertBefore(dropLine,before)}else if(body.lastElementChild!==dropLine)body.appendChild(dropLine);
});
kbCols.addEventListener('drop',e=>{
  const col=e.target.closest('.col');if(!col||!ui.dragTask)return;e.preventDefault();
  let nx=dropLine?.nextElementSibling;while(nx&&!nx.dataset.tid)nx=nx.nextElementSibling;
  const id=ui.dragTask,before=nx&&nx.dataset.tid!==id?nx.dataset.tid:null;clearDrop();ui.dragTask=null;
  moveTaskTo(id,col.dataset.status,before);flashCard(id);
});
$('#kbSearch').addEventListener('input',renderKanban);
$('#kbTag').addEventListener('change',renderKanban);
$('#kbNew').addEventListener('click',()=>openTask(null,'todo'));

/* ================= task modal ================= */
const tm=$('#taskModal'),tf=$('#taskForm');
const isModalOpen=()=>!tm.hidden||!$('#helpModal').hidden;
function fillSelects(){
  const opt=(arr,pre)=>arr.map(k=>`<option value="${k}">${esc(t(pre+k))}</option>`).join('');
  const keep=f=>{const v=tf.elements[f].value;return v};
  const vs=keep('status'),vp=keep('prio'),vt=keep('tag');
  tf.elements.status.innerHTML=opt(STATUSES,'st_');tf.elements.prio.innerHTML=opt(PRIOS,'p_');tf.elements.tag.innerHTML=opt(Object.keys(TAGS),'tag_');
  if(vs)tf.elements.status.value=vs;if(vp)tf.elements.prio.value=vp;if(vt)tf.elements.tag.value=vt;
  const kt=$('#kbTag'),kv=kt.value;kt.innerHTML=`<option value="">${esc(t('allTags'))}</option>`+opt(Object.keys(TAGS),'tag_');kt.value=kv;
}
function openTask(id,status){
  const tk=id?getTask(id):null;ui.modalTask=tk?tk.id:null;
  $('#tmTitle').textContent=t(tk?'editTask':'newTask');
  const E=tf.elements;E.title.value=tk?.title||'';E.desc.value=tk?.desc||'';E.status.value=tk?.status||status||'todo';
  E.prio.value=tk?.prio||'normal';E.tag.value=tk?.tag||$('#kbTag').value||'design';E.assignee.value=tk?.assignee||'';E.due.value=tk?.due||'';
  $('#tmDelete').hidden=!tk;$('#fldTitle').classList.remove('err');
  tm.hidden=false;setTimeout(()=>E.title.focus(),20);
}
function closeModals(){tm.hidden=true;$('#helpModal').hidden=true}
tf.addEventListener('submit',e=>{
  e.preventDefault();const E=tf.elements,title=E.title.value.trim();
  if(!title){const f=$('#fldTitle');f.classList.remove('err');void f.offsetWidth;f.classList.add('err');E.title.focus();return}
  const data={title,desc:E.desc.value.trim(),status:E.status.value,prio:E.prio.value,tag:E.tag.value,assignee:E.assignee.value.trim(),due:E.due.value};
  let id=ui.modalTask;
  if(id){const tk=getTask(id);if(tk){const moved=tk.status!==data.status;Object.assign(tk,data);if(moved){const i=state.tasks.indexOf(tk);state.tasks.splice(i,1);state.tasks.push(tk)}}}
  else{id=uid();state.tasks.push({id,created:Date.now(),...data})}
  commit();closeModals();renderKanban();flashCard(id);
});
$('#tmDelete').addEventListener('click',()=>{
  if(!ui.modalTask||!confirm(t('confirmDelTask')))return;
  state.tasks=state.tasks.filter(x=>x.id!==ui.modalTask);commit();closeModals();renderKanban();toast(t('taskDeleted'),{label:t('undo').split(' (')[0],fn:undo});
});
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))closeModals()}));

/* ================= tabs / lang / menu ================= */
function setTab(tab){
  if(ui.editing)endEdit();
  state.tab=tab;$('#boardView').hidden=tab!=='board';$('#kanbanView').hidden=tab!=='kanban';
  $$('.tabs button').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  if(tab==='board'){measureAll();renderCtx()}else{ctxbar.hidden=true;renderKanban()}
  scheduleSave();
}
$$('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function applyLang(){
  const L=state.lang;document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  $$('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  $$('[data-i18n-title]').forEach(e=>{e.title=t(e.dataset.i18nTitle);e.setAttribute('aria-label',t(e.dataset.i18nTitle))});
  const lb=$('#langBtn');lb.textContent=L==='ar'?'EN':'عربي';lb.title=L==='ar'?'English':'العربية';
  const zt=(id,icon,label,key)=>{$(id).innerHTML=(icon?svg(icon):'')+`<span class="tip">${esc(label)}${key?`<kbd>${key}</kbd>`:''}</span>`};
  zt('#zOut','minus',t('zoomOut'),'−');zt('#zIn','plus',t('zoomIn'),'+');zt('#zFit','fit',t('fit'),'Shift+C');zt('#zHelp','help',t('helpB'),'?');
  zoomLbl.innerHTML=`${Math.round(state.view.z*100)}%<span class="tip">${esc(t('reset100'))}<kbd>0</kbd></span>`;
  $('#projName').value=state.project;
  document.title=(state.project?state.project+' · ':'')+'GameForge';
  fillSelects();buildToolbar();renderToolOpts();buildHelp();renderAll();renderKanban();setSaveStatus(ui.saveStatus);
}
function toggleLang(){
  if(ui.editing)endEdit();
  state.lang=state.lang==='ar'?'en':'ar';
  const reseed=state.pristine;
  if(reseed){const s=seed(state.lang);state.nodes=s.nodes;state.tasks=s.tasks;state.project=s.project;ui.sel.clear();ui.undo=[];ui.redo=[];ui.lastSnap=snapshot();updateUndoBtns()}
  applyLang();
  if(reseed&&state.tab==='board')requestAnimationFrame(()=>centerContent(false));
  scheduleSave();
}
$('#langBtn').addEventListener('click',toggleLang);
$('#projName').addEventListener('input',e=>{state.project=e.target.value;document.title=(state.project?state.project+' · ':'')+'GameForge';scheduleSave()});
$('#projName').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
$('#undoBtn').addEventListener('click',undo);$('#redoBtn').addEventListener('click',redo);
const menu=$('#menu');
function closeMenu(){menu.hidden=true}
$('#menuBtn').addEventListener('click',e=>{e.stopPropagation();menu.hidden=!menu.hidden});
document.addEventListener('click',e=>{if(!menu.hidden&&!e.target.closest('#menu,#menuBtn'))closeMenu()});
menu.addEventListener('click',e=>{
  const b=e.target.closest('[data-menu]');if(!b)return;closeMenu();
  switch(b.dataset.menu){
    case'export':exportProject();break;
    case'import':{const i=$('#jsonInput');i.value='';i.click();break}
    case'help':$('#helpModal').hidden=false;break;
    case'reset':if(confirm(t('confirmReset'))){const s=seed(state.lang);state.nodes=s.nodes;state.tasks=s.tasks;state.project=s.project;ui.sel.clear();commit();state.pristine=true;applyLang();requestAnimationFrame(()=>centerContent())}break;
    case'clear':if(state.nodes.length&&confirm(t('confirmClear'))){state.nodes=[];ui.sel.clear();renderAll();commit()}break;
  }
});
function exportProject(){
  const data=JSON.stringify({app:'GameForge',exportedAt:new Date().toISOString(),state:serial()},null,1);
  const name=(state.project||t('fileName')).replace(/[\\/:*?"<>|]+/g,'').trim().replace(/\s+/g,'-')||'project';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name+'.gameforge.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
$('#jsonInput').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const o=JSON.parse(await f.text());const s=o.state||o;if(!Array.isArray(s.nodes)&&!Array.isArray(s.tasks))throw 0;
    const n=normalize(s);state.nodes=n.nodes;state.tasks=n.tasks;state.project=n.project;state.lang=n.lang;state.prefs=n.prefs;ui.sel.clear();
    commit();applyLang();setTab(state.tab);requestAnimationFrame(()=>centerContent());toast(t('imported'));
  }catch(err){toast(t('importFail'))}
});
function buildHelp(){
  const rows=[['V','t_select'],['H','t_pan'],['Space','h_space'],['P','t_pen'],['N','t_sticky'],['R','t_shape'],['T','t_text'],['I','t_image'],['B','t_table'],['L','t_list'],['S','t_stamp'],['Shift + C','h_center'],['Ctrl + C / X / V','h_clip'],['Ctrl + D','h_dup'],['Ctrl + Z / Shift + Z','h_undo'],['Delete','h_del'],['Ctrl + A','h_all'],['← ↑ → ↓','h_nudge'],['Enter','h_edit'],['Esc','h_esc'],['Ctrl + Wheel · + / −','h_zoom'],['0','h_zoom100'],['G','h_tab'],['?','h_help']];
  $('#keysList').innerHTML=rows.map(([k,l])=>`<div><span>${esc(t(l))}</span><kbd>${esc(k)}</kbd></div>`).join('');
}
$('#zIn').addEventListener('click',()=>zoomAt(1.2,null,null,true));
$('#zOut').addEventListener('click',()=>zoomAt(1/1.2,null,null,true));
zoomLbl.addEventListener('click',()=>setZoom(1));
$('#zFit').addEventListener('click',()=>centerContent());
$('#zHelp').addEventListener('click',()=>{$('#helpModal').hidden=false});

/* ================= keyboard ================= */
document.addEventListener('keydown',e=>{
  const typing=isTyping(e.target);
  if(e.key==='Escape'){
    if(isModalOpen()){closeModals();return}
    if(ui.editing){e.preventDefault();endEdit();return}
    if(typing){e.target.blur();return}
    closeMenu();if(ui.tool!=='select')setTool('select');else if(ui.sel.size)setSel([]);return;
  }
  if(typing||isModalOpen())return;
  const mod=e.ctrlKey||e.metaKey,code=e.code,onBoard=state.tab==='board';
  if(mod){
    switch(code){
      case'KeyZ':e.preventDefault();e.shiftKey?redo():undo();return;
      case'KeyY':e.preventDefault();redo();return;
      case'KeyA':if(onBoard){e.preventDefault();setSel(state.nodes.map(n=>n.id))}return;
      case'KeyD':if(onBoard){e.preventDefault();duplicateSel()}return;
      case'KeyC':if(onBoard&&copySel())toast(t('copied',{n:ui.sel.size}));return;
      case'KeyX':if(onBoard&&copySel()){const ids=[...ui.sel];setTimeout(()=>{removeNodes(ids);commit()},0)}return;
      case'KeyV':if(onBoard){ui.pasteFlag=true;setTimeout(()=>{if(ui.pasteFlag&&ui.clipboard){ui.pasteFlag=false;pasteNodes(ui.clipboard)}},80)}return;
      case'Equal':case'NumpadAdd':e.preventDefault();if(onBoard)zoomAt(1.2,null,null,true);return;
      case'Minus':case'NumpadSubtract':e.preventDefault();if(onBoard)zoomAt(1/1.2,null,null,true);return;
      case'Digit0':case'Numpad0':e.preventDefault();if(onBoard)setZoom(1);return;
    }
    return;
  }
  if(e.altKey)return;
  if(e.key==='?'||e.key==='؟'||(code==='Slash'&&e.shiftKey)){e.preventDefault();$('#helpModal').hidden=false;return}
  if(code==='KeyG'&&!e.shiftKey){setTab(onBoard?'kanban':'board');return}
  if(!onBoard){
    const card=document.activeElement?.closest?.('.card');
    if(card&&(code==='Enter'||code==='Space')){e.preventDefault();openTask(card.dataset.tid)}
    else if(card&&(code==='Delete'||code==='Backspace')&&confirm(t('confirmDelTask'))){state.tasks=state.tasks.filter(x=>x.id!==card.dataset.tid);commit();renderKanban()}
    return;
  }
  if(e.shiftKey&&code==='KeyC'){e.preventDefault();centerContent();return}
  if(code==='Space'){e.preventDefault();if(!ui.spaceDown){ui.spaceDown=true;viewport.classList.add('space')}return}
  if(!e.shiftKey&&TOOL_BY_CODE[code]){e.preventDefault();setTool(TOOL_BY_CODE[code]);return}
  if(code==='Delete'||code==='Backspace'){if(ui.sel.size){e.preventDefault();deleteSel()}return}
  if(code==='Enter'&&ui.sel.size===1){
    const n=selNodes()[0],el=nodeEls.get(n.id)?.querySelector(n.type==='table'?'[data-edit="cell"]':n.type==='list'?'[data-edit="item"]':'[data-edit]');
    if(el){e.preventDefault();beginEdit(el,null,null,true)}return;
  }
  if(code.startsWith('Arrow')&&ui.sel.size){
    e.preventDefault();const s=e.shiftKey?10:1;
    const dx=code==='ArrowLeft'?-s:code==='ArrowRight'?s:0,dy=code==='ArrowUp'?-s:code==='ArrowDown'?s:0;
    for(const n of selNodes()){n.x+=dx;n.y+=dy;positionNode(nodeEls.get(n.id),n)}
    clearTimeout(ui.nudgeT);ui.nudgeT=setTimeout(commit,300);return;
  }
  if(code==='Equal'||code==='NumpadAdd'){zoomAt(1.2,null,null,true);return}
  if(code==='Minus'||code==='NumpadSubtract'){zoomAt(1/1.2,null,null,true);return}
  if(code==='Digit0'||code==='Numpad0'){setZoom(1);return}
});
document.addEventListener('keyup',e=>{if(e.code==='Space'){ui.spaceDown=false;viewport.classList.remove('space')}});
window.addEventListener('blur',()=>{ui.spaceDown=false;viewport.classList.remove('space')});

/* ================= toasts ================= */
function toast(msg,action){
  const d=document.createElement('div');d.className='toast';d.innerHTML=`<span>${esc(msg)}</span>`;
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{action.fn();d.remove()};d.appendChild(b)}
  const box=$('#toasts');box.appendChild(d);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>d.classList.add('out'),action?4200:2600);setTimeout(()=>d.remove(),action?4600:3000);
}

/* ================= boot ================= */
$$('[data-icon]').forEach(e=>e.outerHTML=svg(e.dataset.icon));
$('#undoBtn').innerHTML=svg('undo');$('#redoBtn').innerHTML=svg('redo');$('#menuBtn').innerHTML=svg('more');
(async()=>{
  let saved=null;try{saved=await loadSaved()}catch(e){}
  state=saved?normalize(saved):freshState('ar');
  ui.lastSnap=snapshot();updateUndoBtns();
  viewport.dataset.tool='select';
  applyLang();setTab(state.tab);applyView(false);
  if(!saved){requestAnimationFrame(()=>{centerContent(false);saveNow()})}
  else setSaveStatus('ok');
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  window.GameForge={get state(){return state},centerContent,setTool,saveNow};
})();
})();
</script>
